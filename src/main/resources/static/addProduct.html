<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thêm sản phẩm - Admin</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/premium.css">
</head>
<body>
    <header>
        <div class="header-container">
            <a href="/" class="logo">BAKERY. Admin</a>
        </div>
    </header>
    <main class="container" style="max-width: 600px; margin: 100px auto;">
        <div class="form-box">
            <h1>Thêm sản phẩm mới</h1>
            <form id="addProductForm">
                <table cellpadding="10" style="width: 100%;">
                    <tr>
                        <td><label>Tên Sản Phẩm:</label></td>
                        <td><input type="text" id="name" class="form-control" placeholder="Tên Sản Phẩm" required></td>
                    </tr>
                    <tr>
                        <td><label>Mô Tả:</label></td>
                        <td><input type="text" id="description" class="form-control" placeholder="Mô Tả Sản Phẩm"></td>
                    </tr>
                    <tr>
                        <td><label>Giá:</label></td>
                        <td><input type="number" id="price" class="form-control" placeholder="Giá tiền" required></td>
                    </tr>
                    <tr>
                        <td><label>Giảm Giá (%)</label></td>
                        <td><input type="number" id="discount" class="form-control" placeholder="Giảm Giá" value="0"></td>
                    </tr>
                    <tr>
                        <td><label>URL ảnh</label></td>
                        <td><input type="text" id="imageUrl" class="form-control" placeholder="url" required></td>
                    </tr>
                    <tr>
                        <td><label>Category_ID</label></td>
                        <td><input type="text" id="categoryId" class="form-control" placeholder="Category_ID" required></td>
                    </tr>
                </table>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px;">Lưu Sản Phẩm</button>
            </form>
        </div>
    </main>

<script>
document.getElementById('addProductForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = {
        name: document.getElementById('name').value,
        description: document.getElementById('description').value,
        price: parseFloat(document.getElementById('price').value),
        discount: parseFloat(document.getElementById('discount').value),
        imageUrl: document.getElementById('imageUrl').value,
        categoryId: document.getElementById('categoryId').value
    };

    try {
        const response = await fetch('/api/products/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            alert('Lưu sản phẩm thành công!');
            window.location.href = '/index.html';
        } else {
            alert('Thất bại: ' + await response.text());
        }
    } catch (err) {
        alert('Lỗi: ' + err.message);
    }
});
</script>
</body>
</html>
