<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - Healthy Bakery</title>
    <link rel="stylesheet" href="/assets/css/login-style.css">
    <link rel="stylesheet" href="/assets/css/premium.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="container">
    <div class="form-box register active" style="display: block;">
        <h2><i class="fas fa-birthday-cake"></i> Đăng Ký</h2>

        <form id="registerForm">
            <div id="error-msg" style="color: red; text-align: center; margin-bottom: 10px; display: none;">
                <span></span>
            </div>

            <div class="input-group">
                <input type="text" id="username" placeholder="Họ và tên" required>
                <i class="fas fa-user"></i>
            </div>

            <div class="input-group">
                <input type="text" id="phone_number" placeholder="Số điện thoại" required>
                <i class="fa-solid fa-phone"></i>
            </div>

            <div class="input-group">
                <input type="email" id="email" placeholder="Email" required>
                <i class="fas fa-envelope"></i>
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder="Mật khẩu" required>
                <i class="fas fa-lock"></i>
                <i class="fas fa-eye toggle-password" onclick="togglePassword('password', this)"></i>
            </div>
            <div class="input-group">
                <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                <i class="fas fa-lock"></i>
                <i class="fas fa-eye toggle-password" onclick="togglePassword('confirmPassword', this)"></i>
            </div>

            <button type="submit" class="btn">Tạo Tài Khoản</button>
        </form>

        <div class="toggle-box">
            Bạn đã có tài khoản? <a href="/login.html">Đăng nhập</a>
        </div>
    </div>
</div>

<script>
function togglePassword(id, icon) {
    const input = document.getElementById(id);
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}

document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    // 1. Lấy phần tử nút Submit và lưu lại text gốc
    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalBtnText = submitBtn.innerText;

    const username = document.getElementById('username').value;
    const phone_number = document.getElementById('phone_number').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    const errorEl = document.getElementById('error-msg');
    errorEl.style.display = 'none'; // Ẩn thông báo lỗi cũ đi mỗi lần bấm mới

    if (password !== confirmPassword) {
        errorEl.style.display = 'block';
        errorEl.querySelector('span').innerText = 'Mật khẩu nhập lại không khớp!';
        return;
    }

    // 2. KHÓA NÚT NGAY LẬP TỨC TRƯỚC KHI GỌI API
    submitBtn.disabled = true;
    submitBtn.innerText = 'Đang xử lý...';
    submitBtn.style.opacity = '0.7';
    submitBtn.style.cursor = 'not-allowed';

    try {
        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, phone_number, email, password, confirmPassword })
        });

        if (response.ok) {
            alert('Đăng ký thành công!');
            window.location.href = '/login.html';
            // Thành công thì chuyển trang, không cần mở khóa nút lại
        } else {
            const error = await response.text();
            errorEl.style.display = 'block';
            errorEl.querySelector('span').innerText = error;

            // 3. MỞ KHÓA LẠI NÚT VÌ CÓ LỖI (Trùng email, sai định dạng...)
            submitBtn.disabled = false;
            submitBtn.innerText = originalBtnText;
            submitBtn.style.opacity = '1';
            submitBtn.style.cursor = 'pointer';
        }
    } catch (err) {
        alert('Đã xảy ra lỗi: ' + err.message);

        // 4. MỞ KHÓA LẠI NÚT NẾU LỖI MẠNG (Server sập, rớt mạng...)
        submitBtn.disabled = false;
        submitBtn.innerText = originalBtnText;
        submitBtn.style.opacity = '1';
        submitBtn.style.cursor = 'pointer';
    }
});
</script>
</body>
</html>
