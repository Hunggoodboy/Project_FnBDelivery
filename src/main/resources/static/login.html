<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Healthy Bakery</title>
    <link rel="stylesheet" href="/assets/css/login-style.css">
    <link rel="stylesheet" href="/assets/css/premium.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="container">
    <div class="form-box login active">
        <h2><i class="fas fa-leaf"></i> Đăng Nhập</h2>

        <form id="loginForm">
            <div id="error-msg" style="color: red; text-align: center; margin-bottom: 10px; display: none;">
                <span></span>
            </div>

            <div class="input-group">
                <input type="text" id="phone_number" placeholder="Số điện thoại của bạn" required>
                <i class="fa-solid fa-phone"></i>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Mật khẩu" required>
                <i class="fas fa-lock"></i>
                <i class="fas fa-eye toggle-password" onclick="togglePassword('password', this)"></i>
            </div>

            <div class="forgot-pass">
                <a href="#">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="btn">Đăng Nhập</button>
        </form>

        <div class="social-login">
            <p class="social-text">Hoặc đăng nhập bằng</p>
            <div class="social-icons">
                <a href="#" class="social-btn google"><i class="fab fa-google"></i></a>
                <a href="#" class="social-btn facebook"><i class="fab fa-facebook-f"></i></a>
            </div>
        </div>

        <div class="toggle-box">
            Bạn chưa có tài khoản? <a href="/register.html">Đăng ký ngay</a>
        </div>
    </div>
</div>

<script>
function togglePassword(id, icon) {
    const input = document.getElementById(id);
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const phone_number = document.getElementById('phone_number').value;
    const password = document.getElementById('password').value;
    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalBtnText = submitBtn.innerHTML;

    // Show loading state
    submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang đăng nhập...';
    submitBtn.disabled = true;
    submitBtn.style.opacity = '0.7';
    submitBtn.style.cursor = 'not-allowed';

    try {
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone_number, password })
        });

        if (response.ok) {
            window.location.href = '/index.html';
        } else {
            const error = await response.text();
            const errorEl = document.getElementById('error-msg');
            errorEl.style.display = 'block';
            errorEl.querySelector('span').innerText = error;
            
            // Revert button state
            submitBtn.innerHTML = originalBtnText;
            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';
            submitBtn.style.cursor = 'pointer';
        }
    } catch (err) {
        alert('Đã xảy ra lỗi: ' + err.message);
        // Revert button state
        submitBtn.innerHTML = originalBtnText;
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
        submitBtn.style.cursor = 'pointer';
    }
});
</script>
</body>
</html>
