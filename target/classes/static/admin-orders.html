<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Đơn hàng - FnB Delivery Admin</title>
    <link rel="stylesheet" href="assets/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <img src="assets/img/slider_food.png" alt="Logo">
                <span>FnB Admin</span>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html"><i class="fas fa-home"></i> Trang chủ</a></li>
                    <li class="active"><a href="#"><i class="fas fa-shopping-bag"></i> Đơn hàng</a></li>
                    <li><a href="#"><i class="fas fa-box"></i> Sản phẩm</a></li>
                    <li><a href="#"><i class="fas fa-users"></i> Khách hàng</a></li>
                    <li><a href="#"><i class="fas fa-chart-line"></i> Thống kê</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header>
                <div class="header-left">
                    <h1>Quản lý Đơn hàng</h1>
                    <p>Theo dõi và quản lý các đơn hàng từ khách hàng</p>
                </div>
                <div class="header-right">
                    <div class="user-info">
                        <span>Admin</span>
                        <img src="assets/icon/user.png" alt="Admin">
                    </div>
                </div>
            </header>

            <section class="stats-grid">
                <div class="stat-card" id="btn-today-orders">
                    <div class="stat-icon today"><i class="fas fa-calendar-day"></i></div>
                    <div class="stat-info">
                        <h3>Đơn hôm nay</h3>
                        <p class="stat-value" id="count-today">0</p>
                    </div>
                </div>
                <div class="stat-card" id="btn-all-orders">
                    <div class="stat-icon total"><i class="fas fa-list-ul"></i></div>
                    <div class="stat-info">
                        <h3>Tổng đơn hàng</h3>
                        <p class="stat-value" id="count-all">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon pending"><i class="fas fa-clock"></i></div>
                    <div class="stat-info">
                        <h3>Chờ xử lý</h3>
                        <p class="stat-value" id="count-pending">0</p>
                    </div>
                </div>
            </section>

            <div class="content-card">
                <div class="card-header">
                    <h2 id="table-title">Danh sách Đơn hàng</h2>
                    <div class="filter-actions">
                        <button class="btn btn-secondary" onclick="loadTodayOrders()">Hôm nay</button>
                        <button class="btn btn-primary" onclick="loadAllOrders()">Tất cả</button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Khách hàng</th>
                                <th>SĐT</th>
                                <th>Địa chỉ</th>
                                <th>Thanh toán</th>
                                <th>Tổng tiền</th>
                                <th>Thời gian</th>
                                <th>Trạng thái</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="order-list">
                            <!-- Orders will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Notification Container -->
    <div id="notification-container"></div>

    <script src="assets/js/admin-orders.js"></script>
</body>
</html>
